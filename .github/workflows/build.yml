name: build

# Free on public repositories: GitHub-hosted runners cost nothing here, and the
# project itself is never deployed. This workflow only compiles, tests and
# analyses the code.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Static analysis (Checkstyle — constraint C-01 gate)
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/html/
            build/reports/checkstyle/
          retention-days: 14
          if-no-files-found: ignore
